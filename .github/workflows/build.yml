name: verify-and-deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if SUNAT's source signature is unchanged
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:web
      - run: bun run data:fixture
      - run: docker build -t openrucpe-api:fixture .

  source-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --filter @openrucpe/api
      - id: check
        env:
          PUBLISHED_API_URL: ${{ vars.PUBLISHED_API_URL }}
        run: |
          force=""
          if [[ "${{ inputs.force }}" == "true" ]]; then force="--force"; fi
          bun run data:check $force

  build-and-deploy:
    needs: source-check
    if: needs.source-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: railway-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Mark a fresh snapshot build
        run: printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > apps/api/snapshot-build-id
      - run: npm install --global @railway/cli@5.40.0
      - run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service "$RAILWAY_SERVICE_ID"
